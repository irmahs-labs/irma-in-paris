# Garage, the S3-compatible store the photos live in: one node, one copy.
# The RPC secret is not here: Garage reads it from GARAGE_RPC_SECRET, which
# compose passes in from .env.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
# A copy of the metadata database every 6 hours, so a crash mid-write can be
# recovered from (garage meta snapshot / the docs' "recovering" page).
metadata_auto_snapshot_interval = "6h"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
