<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#f3f1c8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1c2420"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Light or Dark Matcha before the first paint: the saved choice, or
         else the device's setting. src/lib/theme.ts takes over from here. -->
    <script>
      try {
        var saved = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>%APP_NAME%</title>
    <meta
      name="description"
      content="Paris right now: the weather, the next metro, Vélib' bikes, and the restaurants Irma has eaten at."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
