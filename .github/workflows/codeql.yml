# Code scanning from irmahs-labs/workflows: GitHub's security analysis of this
# repo's TypeScript and workflows, on each pull request, each push to main and
# once a week. Findings show in the Security tab.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

jobs:
  codeql:
    uses: irmahs-labs/workflows/.github/workflows/codeql.yml@main
    permissions:
      actions: read
      contents: read
      security-events: write
