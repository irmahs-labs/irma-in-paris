name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy on server
        env:
          POSTGRES_PASSWORD: ${{ secrets.IRMA_IN_PARIS_POSTGRES_PASSWORD }}
          GARAGE_RPC_SECRET: ${{ secrets.IRMA_IN_PARIS_GARAGE_RPC_SECRET }}
          # The app's Garage key: its id is not secret, its secret key is.
          S3_ACCESS_KEY_ID: GK57acb51d3a432bce3ada6cff
          S3_SECRET_ACCESS_KEY: ${{ secrets.IRMA_IN_PARIS_S3_SECRET_KEY }}
          # Optional: without it the transport screen says live times are off.
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
        run: |
          for name in POSTGRES_PASSWORD GARAGE_RPC_SECRET S3_SECRET_ACCESS_KEY; do
            [ -n "${!name}" ] || { echo "The secret behind $name is not set (see README.md)"; exit 1; }
          done
          # Percent-encoded for the postgres:// URLs: a / or @ in the password would
          # otherwise break them, and a parser's error can print part of it.
          POSTGRES_PASSWORD_URL=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["POSTGRES_PASSWORD"], safe=""))')
          # .env is sent over stdin so the secrets never appear in a command line
          printf 'POSTGRES_PASSWORD=%s\nPOSTGRES_PASSWORD_URL=%s\nGARAGE_RPC_SECRET=%s\nS3_ACCESS_KEY_ID=%s\nS3_SECRET_ACCESS_KEY=%s\nPRIM_API_KEY=%s\n' \
            "$POSTGRES_PASSWORD" "$POSTGRES_PASSWORD_URL" "$GARAGE_RPC_SECRET" "$S3_ACCESS_KEY_ID" "$S3_SECRET_ACCESS_KEY" "$PRIM_API_KEY" |
          ssh deploy@${{ secrets.DEPLOY_HOST }} 'set -e
            cd /srv/irma-in-paris
            [ -d .git ] || git clone https://github.com/${{ github.repository }}.git .
            git fetch --depth 1 origin main
            git reset --hard origin/main
            (umask 077 && cat > .env)
            export COMPOSE_FILE=compose.prod.yaml
            docker compose up -d --wait db garage
            sh scripts/garage-init.sh
            # The new app is built before the schema changes, so the old one
            # meets the new schema only while the containers swap.
            docker compose build app
            docker compose run --rm migrate up
            docker compose up -d --remove-orphans --wait app
            docker image prune -f
            docker builder prune -f --filter until=168h'
